<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padha Smart Order</title>
<style>
:root{--bg:#f7ebdd;--card:#fffaf3;--ink:#3b2314;--mute:#8a6a55;--brand:#c98f68;--dark:#4a2c1a;--cream:#ffe3c2;--line:#ecd8c3;--ok:#22a55a;--sh:0 6px 20px rgba(74,44,26,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f140d;--card:#2b1c12;--ink:#fbeedd;--mute:#c4a68c;--line:#42291a;--sh:0 6px 20px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#1f140d;--card:#2b1c12;--ink:#fbeedd;--mute:#c4a68c;--line:#42291a;--sh:0 6px 20px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Poppins","Segoe UI",system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.view{display:none;min-height:100vh}.view.on{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* splash */
#splash.on{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;background:radial-gradient(circle at 50% 30%,#d9a37c,#c98f68 55%,#a9704b);color:#3a200f;overflow:hidden}
#splash h1{font-size:clamp(28px,7vw,46px);letter-spacing:.5px;color:#3a200f;animation:drop .9s cubic-bezier(.2,1.4,.4,1) both}
#splash .logo{width:min(64vw,260px);aspect-ratio:1;border-radius:32px;object-fit:cover;box-shadow:0 20px 50px rgba(58,32,15,.35);animation:pop 1s .5s cubic-bezier(.2,1.4,.4,1) both}
#splash h2{font-size:clamp(20px,5vw,28px);animation:up .8s 1.3s both}
#splash p{max-width:420px;font-size:16px;animation:up .8s 1.8s both}
#splash .go{background:var(--dark);color:var(--cream);padding:14px 38px;border-radius:99px;font-weight:600;font-size:17px;box-shadow:var(--sh);animation:up .8s 2.3s both,pulse 2s 3.2s infinite}
@keyframes drop{from{opacity:0;transform:translateY(-60px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.06)}}
.bean{position:absolute;font-size:28px;opacity:.25;animation:float 9s linear infinite}
@keyframes float{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}
/* nav */
header{position:sticky;top:0;z-index:20;background:var(--dark);color:var(--cream);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px}
header img{width:38px;height:38px;border-radius:10px;object-fit:cover}
header b{font-size:15px;flex:1}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.12);padding:4px;border-radius:99px}
.tabs button{background:none;color:var(--cream);padding:7px 16px;border-radius:99px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--cream);color:var(--dark)}
.cartbtn{position:relative;background:var(--brand);color:#fff;border-radius:50%;width:42px;height:42px;font-size:18px}
.cartbtn i{position:absolute;top:-4px;right:-4px;background:#e0412f;color:#fff;font-size:11px;font-style:normal;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center}
main{max-width:1000px;margin:0 auto;padding:18px 14px 90px}
h3.t{font-size:22px;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.pic{height:130px;display:grid;place-items:center;font-size:62px;cursor:pointer}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h4{font-size:15px}
.price{font-weight:700;color:var(--brand);cursor:pointer}
.card p{font-size:12.5px;color:var(--mute);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.add{background:var(--dark);color:var(--cream);padding:9px;border-radius:12px;font-weight:600;font-size:13px}
.add:active{transform:scale(.96)}
/* detail */
.det{max-width:620px;margin:0 auto;padding:16px 14px 40px}
.back{background:var(--card);padding:8px 16px;border-radius:99px;font-weight:600;box-shadow:var(--sh);margin-bottom:14px}
.det .pic{height:260px;font-size:120px;border-radius:26px;cursor:default}
.det h2{margin:16px 0 4px}.det .price{font-size:24px;cursor:default}
.det p{line-height:1.7;margin:12px 0 20px;color:var(--mute)}
.btn{background:var(--dark);color:var(--cream);padding:14px;border-radius:14px;font-weight:700;width:100%;font-size:16px}
.btn.ok{background:var(--ok);color:#fff}.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
/* cart */
.row{display:flex;align-items:center;gap:12px;background:var(--card);padding:10px 12px;border-radius:16px;margin-bottom:10px;box-shadow:var(--sh)}
.row .e{font-size:34px;width:54px;height:54px;display:grid;place-items:center;border-radius:14px}
.row .i{flex:1;font-size:14px}.row .i small{color:var(--mute);display:block}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;background:var(--cream);color:var(--dark);font-weight:700;font-size:16px}
.qty span{min-width:18px;text-align:center;font-weight:700}
textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font:inherit;resize:vertical;min-height:80px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chips button{background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:12.5px}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:16px 0}
.empty{text-align:center;color:var(--mute);padding:50px 0}
/* pay */
.m{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);padding:16px;border-radius:16px;margin-bottom:10px;border:2px solid transparent;box-shadow:var(--sh)}
.m.on{border-color:var(--brand)}.m span{font-size:28px}.m small{display:block;color:var(--mute)}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:10px}
.timer{font-size:38px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.qr{background:#fff;padding:14px;border-radius:18px;box-shadow:var(--sh)}
.acc{background:var(--card);padding:16px 22px;border-radius:16px;box-shadow:var(--sh);font-size:22px;font-weight:700;letter-spacing:1px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:rot 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}
.check{width:110px;height:110px}
.check circle{stroke:var(--ok);stroke-width:5;fill:none;stroke-dasharray:300;stroke-dashoffset:300;animation:dr .7s forwards}
.check path{stroke:var(--ok);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:dr .5s .6s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.q{background:var(--dark);color:var(--cream);border-radius:20px;padding:14px 30px}
.q b{display:block;font-size:40px;letter-spacing:2px}
.rc{width:100%;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);text-align:left;font-size:14px}
.rc div{display:flex;justify-content:space-between;padding:4px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--dark);color:var(--cream);padding:10px 20px;border-radius:99px;opacity:0;transition:.3s;z-index:50;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

["drinks","🍮","Caramel Macchiato",28000,"Vanilla milk marked with espresso and buttery caramel."],
["drinks","🍵","Matcha Latte",27000,"Ceremonial‑style matcha whisked with creamy milk."],
["drinks","🍫","Choco Hazelnut",26000,"Dark chocolate and hazelnut, served hot or iced."],
["drinks","🫖","Thai Tea",20000,"Spiced Thai tea sweetened with milk, served over ice."],
["drinks","🍋","Lemon Tea",16000,"Fragrant black tea with fresh lemon, bright and refreshing."],
["drinks","🍓","Strawberry Smoothie",25000,"Blended strawberries and yoghurt, fruity and silky."],
["drinks","🥭","Mango Smoothie",25000,"Sweet ripe mango blended with milk and ice."],
["drinks","🍊","Fresh Orange Juice",20000,"Freshly squeezed oranges with no added sugar."],
["drinks","🥥","Es Kelapa Muda",18000,"Young coconut water and tender flesh over crushed ice."],
["drinks","🍪","Cookies & Cream Frappe",29000,"Icy blended cookies and cream topped with whipped cream."]
].map((a,i)=>({id:i,cat:a[0],e:a[1],name:a[2],price:a[3],desc:a[4],h:(i*47)%360}));
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rp=n=>"Rp "+n.toLocaleString("id-ID");
const tint=h=>`background:linear-gradient(135deg,hsl(${h} 70% 90%),hsl(${h} 60% 80%))`;
const S={cat:"food",cart:{},method:null,tm:null,det:null};
function go(id){$$(".view").forEach(v=>v.classList.toggle("on",v.id===id));scrollTo(0,0)}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1400)}
const count=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const total=()=>Object.entries(S.cart).reduce((a,[i,q])=>a+T[i].price*q,0);
function badge(){$("#badge").textContent=count()}

// splash
$("#splash").innerHTML=Array.from({length:8},(_,i)=>`<span class="bean" style="left:${i*13}%;animation-delay:${-i*1.1}s">☕</span>`).join("")+
`<h1>Padha Smart Order</h1><img class="logo" src="${LOGO}" alt="Padha Coffee logo"><h2>Welcome to Padha Coffee</h2><p>Padha Coffee: Where All Flavors Come Together.</p><button class="go" id="start">Order Now</button>`;
$("#start").onclick=()=>{go("catalog");render()};

// catalog
function render(){
  $("#ct").textContent=S.cat==="food"?"Food Menu":"Drinks Menu";
  $("#grid").innerHTML=T.filter(t=>t.cat===S.cat).map(t=>`<article class="card"><div class="pic" data-d="${t.id}" style="${tint(t.h)}">${t.e}</div><div class="body"><h4>${t.name}</h4><div class="price" data-d="${t.id}">${rp(t.price)}</div><p>${t.desc}</p><button class="add" data-a="${t.id}">+ Add to cart</button></div></article>`).join("");
  $$(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.c===S.cat));
  badge();
}
$$(".tabs button").forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;render();scrollTo(0,0)});
function add(i){S.cart[i]=(S.cart[i]||0)+1;badge();toast(T[i].name+" added to cart")}
$("#grid").onclick=e=>{
  const a=e.target.closest("[data-a]"),d=e.target.closest("[data-d]");
  if(a)add(+a.dataset.a);else if(d)detail(+d.dataset.d);
};
function detail(i){
  const t=T[i];
  $("#detBox").innerHTML=`<button class="back" data-go="catalog">← Back to menu</button><div class="pic" style="${tint(t.h)}">${t.e}</div><h2>${t.name}</h2><div class="price">${rp(t.price)}</div><p>${t.desc}</p><button class="btn" id="dAdd">Add to cart</button>`;
  $("#dAdd").onclick=()=>add(i);
  go("detail");
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){const id=g.dataset.go;if(id==="catalog")render();if(id==="cart")cartView();go(id)}
});
$("#toCart").onclick=()=>{cartView();go("cart")};

// cart
const CH=["Less sugar","No sugar","Less ice","No ice","Extra hot","Not spicy"];
$("#chips").innerHTML=CH.map(c=>`<button>${c}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;const n=$("#note");if(!n.value.includes(b.textContent))n.value+=(n.value?", ":"")+b.textContent};
function cartView(){
  const ids=Object.keys(S.cart);
  $("#cartList").innerHTML=ids.length?ids.map(i=>{const t=T[i];return `<div class="row"><div class="e" style="${tint(t.h)}">${t.e}</div><div class="i"><b>${t.name}</b><small>${rp(t.price)}</small></div><div class="qty"><button data-q="${i}" data-s="-1">−</button><span>${S.cart[i]}</span><button data-q="${i}" data-s="1">+</button></div></div>`}).join(""):`<div class="empty">Your cart is empty.<br>Add something delicious!</div>`;
  $("#cartExtra").style.display=ids.length?"block":"none";
  $("#total").textContent=rp(total());badge();
}
$("#cartList").onclick=e=>{
  const b=e.target.closest("[data-q]");if(!b)return;
  const i=b.dataset.q,n=(S.cart[i]||0)+ +b.dataset.s;
  if(n<=0)delete S.cart[i];else S.cart[i]=n;
  cartView();
};
$("#checkout").onclick=()=>{S.method=null;$$(".m").forEach(m=>m.classList.remove("on"));$("#payBtn").disabled=true;$("#payBtn").style.opacity=.5;$("#payTotal").textContent=rp(total());go("pay")};

// pay
$$(".m").forEach(m=>m.onclick=()=>{S.method=m.dataset.m;$$(".m").forEach(x=>x.classList.toggle("on",x===m));$("#payBtn").disabled=false;$("#payBtn").style.opacity=1});
$("#payBtn").onclick=()=>{
  if(!S.method)return;
  clearInterval(S.tm);
  const box=$("#waitBox"),amt=rp(total());
  if(S.method==="Cash"){
    box.innerHTML=`<div style="font-size:70px">💵</div><h2>Please go to the cashier</h2><p style="color:var(--mute)">Show this order to our cashier and pay <b>${amt}</b> in cash at the counter.</p><div class="q"><small>Order code</small><b>${code()}</b></div><button class="btn ok" id="cashOk">Cashier has received my payment</button>`;
    go("wait");$("#cashOk").onclick=()=>success();return;
  }
  let left=15*60;
  const qris=S.method==="QRIS";
  box.innerHTML=`<h2>${qris?"Scan to pay with QRIS":"Bank Transfer"}</h2><div class="timer" id="tm">15:00</div><small style="color:var(--mute)">Complete your payment before the timer ends</small>`+
   (qris?`<div class="qr">${qr()}</div><b>${amt}</b>`:`<div>Bank Central Asia (BCA)</div><div class="acc">8830 1234 5678</div><small>a.n. Padha Coffee</small><b style="font-size:20px">${amt}</b>`)+
   `<div style="color:var(--mute)"><span class="spin"></span>Waiting for payment… detected automatically</div><button class="btn ghost" id="cancel">Cancel</button>`;
  go("wait");
  $("#cancel").onclick=()=>{clearInterval(S.tm);go("pay")};
  const fmt=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
  let el=0;
  S.tm=setInterval(()=>{
    left--;el++;$("#tm").textContent=fmt(left);
    if(el===9){clearInterval(S.tm);success()} // demo: simulated automatic payment detection
    else if(left<=0){clearInterval(S.tm);box.innerHTML=`<div style="font-size:60px">⌛</div><h2>Payment time expired</h2><button class="btn" id="retry">Try again</button>`;$("#retry").onclick=()=>go("pay")}
  },1000);
};
let seq=0;const code=()=>S.code||(S.code="PD"+Math.floor(1000+Math.random()*9000));
function qr(){
  let s=7,r=()=>(s=(s*16807)%2147483647)/2147483647,n=25,c=8,o="";
  const fin=(x,y)=>(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    let on;
    if(fin(x,y)){const lx=x%(n-7)>=0&&x>=n-7?x-(n-7):x,ly=y>=n-7?y-(n-7):y;on=!(lx>0&&lx<6&&ly>0&&ly<6)||(lx>1&&lx<5&&ly>1&&ly<5)}
    else on=r()>.52;
    if(on)o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" width="210" height="210" fill="#1b1008">${o}</svg>`;
}
function success(){
  const m=S.method,ids=Object.keys(S.cart),first=T[ids[0]].name;
  const msg=m==="Cash"?"Thank you, we have received your payment in cash.":`Thank you, we have received your payment via ${m}.`;
  const rest=ids.length>1||S.cart[ids[0]]>1?" and the rest of your order":"";
  const queue="A-"+String(Math.floor(1+Math.random()*99)).padStart(3,"0");
  $("#doneBox").innerHTML=`<svg class="check" viewBox="0 0 110 110"><circle cx="55" cy="55" r="48"/><path d="M32 57l16 16 31-34"/></svg><h2 style="color:var(--ok)">Payment Successful!</h2><p>${msg} Just sit back and relax. Our baristas are crafting your <b>${first}</b>${rest} with great care. Please check your order details and queue number below!</p><div class="q"><small>Your queue number</small><b>${queue}</b></div><div class="rc">${ids.map(i=>`<div><span>${S.cart[i]}× ${T[i].name}</span><span>${rp(T[i].price*S.cart[i])}</span></div>`).join("")}${$("#note").value?`<div><span>📝 ${$("#note").value.replace(/</g,"&lt;")}</span></div>`:""}<div style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700"><span>Total (${m})</span><span>${rp(total())}</span></div></div><button class="btn" id="again">Order again</button>`;
  go("done");
  $("#again").onclick=()=>{S.cart={};S.code=null;$("#note").value="";render();go("catalog")};
}
</script>
</body>
</html>
